version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: boilerplate_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: boilerplate_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations/001_create_rbac_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seeders/001_seed_rbac.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d boilerplate_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
